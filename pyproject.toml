[project]
name = "sanmei"
version = "0.1.0"
description = "六十の風景 — 算命学 算出層（決定的・依存なし）"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ephem>=4.1"]

[tool.setuptools.packages.find]
include = ["sanmei*"]

[tool.setuptools.package-data]
sanmei = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
