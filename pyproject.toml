[project]
name = "sanmei"
version = "0.1.0"
description = "六十の風景 — 算命学 算出層（決定的・依存なし）"
requires-python = ">=3.12"
dependencies = ["anthropic>=1.13", "fastapi>=0.115", "jinja2>=3.1", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ephem>=4.1", "httpx>=0.27"]

[tool.setuptools]
packages = ["sanmei", "seisei", "shindan"]

[tool.setuptools.package-data]
sanmei = ["data/*.json"]
shindan = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
