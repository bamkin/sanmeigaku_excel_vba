<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}六十の風景{% endblock %}</title>
{% block head %}{% endblock %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --sumi: #1f1f1f; --ai: #3b5b7a; --usuai: #9fb3c8; --washi: #f7f4ec; }
  html { background: var(--washi); }
  body { margin: 0; color: var(--sumi); background: var(--washi);
         font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
         font-size: 17px; line-height: 2; letter-spacing: 0.04em; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px 80px; }
  header { font-size: 14px; letter-spacing: 0.3em; color: var(--ai); margin-bottom: 40px; }
  header a { color: inherit; text-decoration: none; }
  h1 { font-weight: 500; font-size: 26px; letter-spacing: 0.12em; margin: 0 0 8px; }
  .season { color: var(--ai); margin: 0 0 28px; }
  p { margin: 0 0 1.6em; }
  .hitokoto { border-top: 1px solid var(--usuai); border-bottom: 1px solid var(--usuai); padding: 20px 0; margin: 36px 0; }
  .closing { margin: 28px 0 40px; }
  form { margin: 24px 0; }
  label { display: block; margin-bottom: 8px; color: var(--ai); font-size: 15px; }
  input[type=date], input[type=text] { font: inherit; font-size: 18px; padding: 8px 12px; border: 1px solid var(--usuai);
         background: #fff; color: var(--sumi); width: 100%; max-width: 320px; box-sizing: border-box; }
  select { font: inherit; padding: 8px; border: 1px solid var(--usuai); background: #fff; }
  button, .button { display: inline-block; font: inherit; font-size: 16px; letter-spacing: 0.1em; padding: 10px 28px; margin-top: 16px;
         color: var(--washi); background: var(--ai); border: none; cursor: pointer; text-decoration: none; }
  .error { color: #8a3b3b; }
  .share { font-size: 14px; color: var(--ai); }
  .share a { color: var(--ai); }
  .card { width: 100%; height: auto; border: 1px solid var(--usuai); margin: 12px 0; }
  footer { margin-top: 64px; font-size: 13px; color: var(--ai); letter-spacing: 0.1em; }
</style>
</head>
<body>
<main>
<header><a href="/">六十の風景</a></header>
{% block body %}{% endblock %}
<footer>六十の風景</footer>
</main>
</body>
</html>
